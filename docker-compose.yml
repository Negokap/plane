# Project name pinned so containers and volumes (plane_uploads etc.) stay the same
# whichever directory this file is run from (/opt/plane by hand, /opt/setjoo-projects by the pipeline).
name: plane

services:
  web:
    image: ${PLANE_IMAGE:-plane}:web-${PLANE_TAG:-local}
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api

  admin:
    image: ${PLANE_IMAGE:-plane}:admin-${PLANE_TAG:-local}
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web

  space:
    image: ${PLANE_IMAGE:-plane}:space-${PLANE_TAG:-local}
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web

  api:
    image: ${PLANE_IMAGE:-plane}:api-${PLANE_TAG:-local}
    container_name: api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - .env
    depends_on:
      - plane-redis

  worker:
    image: ${PLANE_IMAGE:-plane}:api-${PLANE_TAG:-local}
    container_name: bgworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - .env
    depends_on:
      - api
      - plane-redis

  beat-worker:
    image: ${PLANE_IMAGE:-plane}:api-${PLANE_TAG:-local}
    container_name: beatworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - .env
    depends_on:
      - api
      - plane-redis

  migrator:
    image: ${PLANE_IMAGE:-plane}:api-${PLANE_TAG:-local}
    container_name: plane-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: no
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - .env
    depends_on:
      - plane-redis

  live:
    image: ${PLANE_IMAGE:-plane}:live-${PLANE_TAG:-local}
    container_name: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - .env
    environment:
      # api reads PORT too (gunicorn, default 8000), so live's port can't live in the shared .env
      PORT: "3000"

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    container_name: plane-minio
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  # Comment this if you already have a reverse proxy running
  proxy:
    image: ${PLANE_IMAGE:-plane}:proxy-${PLANE_TAG:-local}
    container_name: proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports:
      - 127.0.0.1:${LISTEN_HTTP_PORT}:80
      - 127.0.0.1:${LISTEN_HTTPS_PORT}:443
    env_file:
      - .env
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    depends_on:
      - web
      - api
      - space
      - admin

volumes:
  redisdata:
  uploads:
  rabbitmq_data:
